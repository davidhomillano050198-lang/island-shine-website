<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Island Shine — Coming Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #f6f8fc 0%, #e9eefb 55%, #fbf3dd 100%);
    color: #141a2b;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(61, 93, 212, 0.14);
    border-radius: 24px;
    padding: 56px 40px;
    box-shadow: 0 30px 70px -30px rgba(61, 93, 212, 0.35);
    backdrop-filter: blur(8px);
  }
  .dot {
    width: 64px; height: 64px;
    margin: 0 auto 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3d5dd4, #0aa2c4);
    box-shadow: 0 12px 30px -10px rgba(61, 93, 212, 0.55);
  }
  .dot span { font-size: 28px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: #3d5dd4; }
  h1 .y { color: #fcbe13; }
  p { margin-top: 14px; font-size: 15.5px; line-height: 1.65; color: #4a5268; }
  .badge {
    display: inline-block;
    margin-top: 26px;
    padding: 10px 22px;
    border-radius: 999px;
    background: #fcbe13;
    color: #15130f;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"><span>✨</span></div>
    <h1><em>Island</em> Shine<span class="y">.</span></h1>
    <p>The preview period for this website has ended.<br />
    Our full website is being finalised and will be live very soon.</p>
    <div class="badge">Launching soon</div>
  </div>
</body>
</html>
